<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>

  <header class="header">
    <div class="logo"><a href="index.html">
      <img src="web_logo.png" alt="Logo"></a>
    </div>
  
    <div class="search-toggle" id="search">🔍</div>
  
    <div class="search-bar" id="search-bar">
      <input type="text" placeholder="Search...">
      <button>Search</button>
    </div>
  
    <nav class="navbar" id="navbar">
      <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="course list.html">Courses</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact us.html">Contact</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>

        </ul>
        
    </nav>
    
    <div class="menu-toggle" id="mobile-menu">
        ☰
      </div>
      
    <div class="auth-btn">
        <button>Login</button>
    </div>
    
    
</header>

  <div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Skillify Learn</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Assignments</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="Dashboard-content">
      <header class="topbar">
        <h1>Welcome Back, Danish!</h1>
      </header>

      <section class="cards">
        <div class="card">
          <h3>Enrolled Courses</h3>
          <p>5 Courses</p>
        </div>
        <div class="card">
          <h3>Completed Lessons</h3>
          <p>27 Lessons</p>
        </div>
        <div class="card">
          <h3>Assignments</h3>
          <p>3 Pending</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById('mobile-menu');
    const navbar = document.getElementById('navbar');
    menuToggle.addEventListener('click', () => {
      navbar.classList.toggle('active');
    });
  
    // Search bar toggle
    const searchToggle = document.getElementById('search');
    console.log(searchToggle);
    
    const searchBar = document.querySelector('.search-bar');
    console.log(searchBar);
    
    searchToggle.addEventListener('click', (e) => {
        
      searchBar.classList.toggle('active');
    });
  </script>

</body>
</html>
